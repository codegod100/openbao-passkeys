<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OpenBao Passkeys</title>
    <link rel="stylesheet" href="../shared/ui.css" />
    <style>
      body {
        width: 360px;
      }
    </style>
  </head>
  <body>
    <div class="shell stack">
      <div class="brand">
        <img src="../../icons/icon48.png" alt="" />
        <h1>OpenBao Passkeys</h1>
      </div>

      <section class="card stack">
        <div class="row">
          <div>
            <strong>WebAuthn proxy</strong>
            <p class="muted">When on, this extension handles site passkey create/get.</p>
          </div>
        </div>
        <label class="toggle">
          <input type="checkbox" id="proxyToggle" />
          Intercept WebAuthn
        </label>
        <p class="status" id="proxyStatus"></p>
      </section>

      <section class="card stack">
        <div class="row">
          <strong>Stored passkeys</strong>
          <button class="btn linkish" id="refreshBtn" type="button">Refresh</button>
        </div>
        <div class="list" id="list"></div>
        <p class="status" id="listStatus">Loading…</p>
      </section>

      <div class="actions">
        <button class="btn secondary" id="optionsBtn" type="button">OpenBao settings</button>
      </div>
    </div>
    <script type="module" src="./popup.js"></script>
  </body>
</html>
