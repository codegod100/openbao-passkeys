<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OpenBao Passkeys</title>
    <link rel="stylesheet" href="../shared/ui.css" />
    <style>
      body {
        width: 380px;
      }
    </style>
  </head>
  <body>
    <div class="shell stack">
      <div class="brand">
        <img src="../../icons/icon48.png" alt="" />
        <h1>OpenBao Passkeys</h1>
      </div>

      <section class="card stack">
        <div class="row">
          <div>
            <strong>WebAuthn proxy</strong>
            <p class="muted">When on, this extension handles site passkey create/get.</p>
          </div>
        </div>
        <label class="toggle">
          <input type="checkbox" id="proxyToggle" />
          Intercept WebAuthn
        </label>
        <p class="status" id="proxyStatus"></p>
      </section>

      <div class="tabs" role="tablist">
        <button class="tab active" type="button" data-tab="passkeys" role="tab" aria-selected="true">Passkeys</button>
        <button class="tab" type="button" data-tab="passwords" role="tab" aria-selected="false">Passwords</button>
      </div>

      <label class="field">
        Search
        <input id="listSearch" type="search" placeholder="Filter by domain, username, id…" autocomplete="off" />
      </label>

      <section class="card stack" id="passkeysPanel">
        <div class="row">
          <strong>Stored passkeys</strong>
          <button class="btn linkish" id="refreshPasskeysBtn" type="button">Refresh</button>
        </div>
        <div class="list" id="passkeyList"></div>
        <p class="status" id="passkeyStatus">Loading…</p>
      </section>

      <section class="card stack" id="passwordsPanel" hidden>
        <div class="row">
          <strong>Stored passwords</strong>
          <button class="btn linkish" id="refreshPasswordsBtn" type="button">Refresh</button>
        </div>
        <form class="stack" id="addPasswordForm">
          <label class="field">
            Origin
            <input id="newOrigin" type="url" placeholder="https://example.com" required />
          </label>
          <label class="field">
            Username
            <input id="newUsername" type="text" autocomplete="off" />
          </label>
          <label class="field">
            Password
            <input id="newPassword" type="password" autocomplete="new-password" required />
          </label>
          <button class="btn" type="submit">Save password</button>
          <p class="status" id="addPasswordStatus"></p>
        </form>
        <div class="list" id="passwordList"></div>
        <p class="status" id="passwordStatus">Loading…</p>
      </section>

      <div class="actions">
        <button class="btn secondary" id="optionsBtn" type="button">OpenBao settings</button>
      </div>
    </div>
    <script type="module" src="./popup.js"></script>
  </body>
</html>
