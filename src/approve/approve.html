<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Approve passkey</title>
    <link rel="stylesheet" href="../shared/ui.css" />
    <style>
      body {
        width: 400px;
      }
    </style>
  </head>
  <body>
    <div class="shell stack">
      <div class="brand">
        <img src="../../icons/icon48.png" alt="" />
        <h1 id="title">Passkey request</h1>
      </div>
      <section class="card stack" id="details"></section>
      <div id="choices" class="stack"></div>
      <div class="actions">
        <button class="btn" id="approveBtn" type="button">Allow</button>
        <button class="btn secondary" id="denyBtn" type="button">Deny</button>
      </div>
      <p class="status" id="status"></p>
    </div>
    <script type="module" src="./approve.js"></script>
  </body>
</html>
